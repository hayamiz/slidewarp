# 公開用サンプルの厳選リストと画像ごとの手動オーバーライド。
# quad / faces を書くと自動検出をそれぞれ「置換 / 追加」する。
# スライド内部は強ぼかし（グリッド線を作らず検出への影響を抑える）、顔はモザイク。
mosaic_inset = 0.06          # スライド内側マージン（辺は無処理のまま残す）
slide_blur_sigma = 15        # スライド内部ぼかしσ(px,絶対値)。軽ぼかしで検出を保つ既定
face_band = 0.22             # 人物マスク上部の顔バンド比
face_block = 8               # 顔モザイクのブロック分割数（顔領域短辺 / これ）
face_max_width_frac = 0.35   # 誤セグメントの広すぎる顔帯を画像幅のこの比率に制限

# 画像ごとに slide_blur_sigma = <px> を書くとその画像のσを個別上書きできる。

